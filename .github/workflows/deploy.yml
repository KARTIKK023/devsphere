name: Build, publish & deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "documentation.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: devsphere-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAMESPACE: kartikcdhry

jobs:
  build-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/devsphere-backend:latest
            ${{ env.IMAGE_NAMESPACE }}/devsphere-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/devsphere-frontend:latest
            ${{ env.IMAGE_NAMESPACE }}/devsphere-frontend:${{ github.sha }}

  render-deploy:
    name: Trigger Render redeploy
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Trigger backend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger frontend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"